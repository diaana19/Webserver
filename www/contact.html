<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Contact Form</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <div class="contact-page">
        <header class="navbar shadow-nav">
            <h2 class="logo2">Webserv</h2>
            <nav>
                <a href="/" class="dark-link">Home</a>
                <a href="/#tests" class="dark-link">Tests</a>
            </nav>
        </header>

        <section class="form-section">
            <h1 class="form-title">📝 Contact Form</h1>
            <form method="POST" action="/contact" class="contact-form">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" placeholder="Your name" required>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="your@email.com" required>
                <label for="message">Message:</label>
                <textarea id="message" name="message" placeholder="Your message" rows="5" required></textarea>
                <button type="submit">Send Message</button>
            </form>
        </section>

        <div class="back-section" style="position:relative;z-index:2;margin-bottom:40px;">
            <a href="/" class="btn-back">← Back to Home</a>
        </div>
    </div>

    <footer><p>Webserv Project | 42 School</p></footer>
</body>
</html>
