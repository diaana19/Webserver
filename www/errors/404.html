<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>404 - Not Found</title>
    <link rel="stylesheet" href="/styles.css">
    <style>
        body { background: linear-gradient(160deg, #e8f4fd 0%, #ede8f5 50%, #f0f4ff 100%); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Sora', sans-serif; }
        .error-card { max-width: 500px; width: calc(100% - 40px); background: rgba(255,255,255,0.82); backdrop-filter: blur(16px); border-radius: 28px; padding: 52px 40px; box-shadow: 0 8px 32px rgba(140,180,220,0.25); border: 1px solid rgba(255,255,255,0.95); text-align: center; }
        .code { font-size: 88px; font-weight: 800; background: linear-gradient(135deg, #90c8f6, #a78ec7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; line-height: 1; margin-bottom: 8px; }
        h2 { font-size: 22px; font-weight: 700; color: #1e2d4a; margin-bottom: 12px; }
        p { color: #4a5a74; font-size: 15px; margin-bottom: 28px; line-height: 1.6; }
        .btn { display: inline-block; padding: 12px 32px; background: linear-gradient(135deg, #90c8f6, #a78ec7); color: white; border-radius: 50px; text-decoration: none; font-weight: 700; font-size: 14px; box-shadow: 0 4px 16px rgba(144,200,246,0.35); transition: transform 0.2s; }
        .btn:hover { transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="code">404</div>
        <h2>Page Not Found</h2>
        <p>The page you're looking for doesn't exist or has been moved.</p>
        <a href="/" class="btn">← Back to Home</a>
    </div>
</body>
</html>
