<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Multiple Files - Webserv</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <header class="navbar">
        <h2 class="logo2">Webserv</h2>
        <nav>
            <a href="/" class="dark-link">Home</a>
            <a href="/#tests" class="dark-link">Tests</a>
        </nav>
    </header>

    <div class="upload-page">
        <div class="upload-card">
            <h1>📦 Multiple Files</h1>
            <p class="upload-subtitle">Upload several files at once</p>

            <form method="POST" action="/upload" enctype="multipart/form-data">
                <div class="upload-zone">
                    <input type="file" name="files" multiple required>
                    <p>Hold Ctrl / Cmd to select multiple files</p>
                </div>
                <button type="submit" class="upload-btn">⬆ Upload All Files</button>
            </form>

            <div class="upload-info">
                <strong>Instructions</strong>
                <ul>
                    <li>Hold <strong>Ctrl</strong> (or <strong>Cmd</strong> on Mac) to select multiple files</li>
                    <li>Click "Upload All Files"</li>
                    <li>All files saved in <code>uploads/</code> directory</li>
                </ul>
            </div>

            <div class="back-section">
                <a href="/" class="btn-back">← Back to Home</a>
            </div>
        </div>
    </div>

    <footer><p>Webserv Project | 42 School</p></footer>
</body>
</html>
