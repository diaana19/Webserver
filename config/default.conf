server 
{
    listen 8080;
    host 127.0.0.1;
    server_name webserv;
    root www;     
    index index.html;    
    client_max_body_size 10485760;
    
    error_page 404 www/errors/404.html;
    
    location / 
	{
        root www;
        index index.html;
        allow_methods GET POST DELETE;
        autoindex off;
    }
    
    location /contact   
	{
        allow_methods GET POST;
    }
    
    location /upload
	{
        allow_methods GET POST DELETE;
        upload_path www/upload/;
        autoindex on;
    }

    location /cgi-bin 
    {
        allow_methods GET POST;
        cgi_path www/cgi-bin;
        cgi_interpreter /usr/bin/python3;
        cgi_ext .php .py .sh;
    }

    location /redirect 
    {
		return 302 /team.txt;
	}
}